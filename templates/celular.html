<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Biométrica - Chapa NFC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .header-terminal {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 8px 15px;
            border-radius: 8px;
            border-bottom: 2px solid #00ff88;
        }
        #reloj { font-size: 1.3rem; font-weight: bold; color: #00ff88; }
        #fecha { font-size: 0.8rem; color: #888; text-transform: uppercase; }

        .terminal-screen {
            position: relative;
            width: 100%;
            max-width: 380px;
            flex-grow: 1;
            max-height: 44vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .face-frame {
            position: absolute;
            width: 130px;
            height: 170px;
            border: 2px dashed rgba(0, 255, 136, 0.7);
            border-radius: 50% / 40%;
            pointer-events: none;
        }
        .btn-accion {
            position: absolute;
            bottom: 8px;
            background: rgba(0, 255, 136, 0.9);
            color: #000;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10;
        }

        /* BANNER DE ESTADO GIGANTE (AUTORIZADO / DENEGADO / ESPERA) */
        #banner-estado {
            width: 100%;
            max-width: 400px;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .estado-listo { background-color: #1b5e20; color: #a5d6a7; border: 2px solid #4caf50; }
        .estado-espera { background-color: #e65100; color: #ffe0b2; border: 2px solid #ff9800; }
        .estado-denegado { background-color: #b71c1c; color: #ffcdd2; border: 2px solid #f44336; }

        .info-acceso {
            width: 100%;
            max-width: 400px;
            background: #1a1a1a;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #00ff88;
            margin-top: 4px;
        }
        .info-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #333; }
        .info-detalles { text-align: left; flex-grow: 1; overflow: hidden; }
        .info-detalles b { font-size: 0.9rem; color: #fff; }
        .info-detalles p { font-size: 0.75rem; color: #aaa; margin-top: 2px; }
        .badge-estado { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-ok { background: #2e7d32; color: #fff; }
        .badge-fail { background: #c62828; color: #fff; }
    </style>
</head>
<body>

    <div class="header-terminal">
        <div id="reloj">00:00:00</div>
        <div id="fecha">Cargando...</div>
    </div>

    <div class="terminal-screen">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="face-frame"></div>
        <button class="btn-accion" onclick="activarCamaraManual()">📷 Activar Cámara</button>
        <button class="btn-accion" style="right: 15px;" onclick="capturarYVerificarRostro()">🔘 Escanear</button>
    </div>

    <!-- BANNER DE ESTADO DINÁMICO -->
    <div id="banner-estado" class="estado-listo">
        ✅ TERMINAL ACTIVA - ESPERANDO TARJETA O ROSTRO
    </div>

    <div class="info-acceso">
        <img src="https://via.placeholder.com/42" class="info-avatar" id="u-avatar" alt="Avatar">
        <div class="info-detalles">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <b id="u-nombre">Esperando lectura...</b>
                <span id="u-badge" class="badge-estado badge-ok">ESPERA</span>
            </div>
            <p id="u-meta">UID: -------- | --:--:--</p>
        </div>
    </div>

    <script>
        async function activarCamaraManual() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, audio: false 
                });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                console.warn("Cámara no iniciada:", err);
            }
        }

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString('es-CL');
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-CL', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function capturarYVerificarRostro() {
            const video = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            fetch('/api/verificar_rostro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imagen: canvas.toDataURL('image/jpeg') })
            }).catch(err => console.error(err));
        }

        function actualizarEstado() {
            fetch('/api/estado')
                .then(res => res.json())
                .then(data => {
                    const banner = document.getElementById('banner-estado');
                    
                    if (data.logs && data.logs.length > 0) {
                        let ultimo = data.logs[0];
                        let ahoraEpoch = Math.floor(Date.now() / 1000);
                        let diffTiempo = ahoraEpoch - (parseInt(ultimo.timestamp) || 0);

                        // Si el último evento pasó hace menos de 5 segundos, dispara el banner de color
                        if (diffTiempo < 5) {
                            if (ultimo.estado === "PERMITIDO") {
                                banner.className = "estado-espera";
                                banner.innerHTML = `🔓 ACCESO AUTORIZADO<br>${ultimo.usuario}`;
                            } else {
                                banner.className = "estado-denegado";
                                banner.innerHTML = `❌ ACCESO DENEGADO<br>${ultimo.usuario || 'Tarjeta No Registrada'}`;
                            }
                        } else if (data.chapa_abierta && data.tiempo_restante > 0) {
                            banner.className = "estado-espera";
                            banner.innerHTML = `⏳ ABRIENDO PUERTA (${data.tiempo_restante}s)`;
                        } else {
                            banner.className = "estado-listo";
                            banner.innerHTML = "✅ TERMINAL ACTIVA - ESPERANDO TARJETA O ROSTRO";
                        }

                        // Sincronizar abajo la información de la tarjeta o usuario
                        document.getElementById('u-nombre').innerText = ultimo.usuario || "Desconocido";
                        document.getElementById('u-meta').innerText = `UID: ${ultimo.uid || 'N/A'} | ${ultimo.fecha_hora}`;
                        
                        const badge = document.getElementById('u-badge');
                        if (ultimo.estado === "PERMITIDO") {
                            badge.className = "badge-estado badge-ok";
                            badge.innerText = "ACEPTADO";
                        } else {
                            badge.className = "badge-estado badge-fail";
                            badge.innerText = "DENEGADO";
                        }

                        if (ultimo.foto_biometria) {
                            document.getElementById('u-avatar').src = `/${ultimo.foto_biometria}`;
                        }
                    } else {
                        banner.className = "estado-listo";
                        banner.innerHTML = "✅ TERMINAL ACTIVA - ESPERANDO TARJETA O ROSTRO";
                    }
                })
                .catch(err => console.error(err));
        }

        activarCamaraManual();
        setInterval(actualizarReloj, 1000);
        setInterval(actualizarEstado, 300); // Lee los logs cada 300 milisegundos para cero retraso
        actualizarReloj();
        actualizarEstado();
    </script>
</body>
</html>
