<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Biométrica - Chapa NFC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .header-terminal {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 8px 15px;
            border-radius: 8px;
            border-bottom: 2px solid #00ff88;
        }
        #reloj { font-size: 1.3rem; font-weight: bold; color: #00ff88; }
        #fecha { font-size: 0.8rem; color: #888; text-transform: uppercase; }

        .terminal-screen {
            position: relative;
            width: 100%;
            max-width: 380px;
            flex-grow: 1;
            max-height: 40vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-frame {
            position: absolute;
            width: 130px;
            height: 170px;
            border: 2px dashed rgba(0, 255, 136, 0.7);
            border-radius: 50% / 40%;
            pointer-events: none;
        }
        .btn-accion {
            position: absolute;
            bottom: 8px;
            background: rgba(0, 255, 136, 0.9);
            color: #000;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10;
        }

        /* BANNER DE ESTADO */
        #banner-estado {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            transition: background-color 0.2s ease;
        }
        #b-titulo { font-size: 1.05rem; font-weight: bold; }
        .estado-ok { background-color: #1b5e20; color: #a5d6a7; border: 2px solid #4caf50; }
        .estado-espera { background-color: #e65100; color: #ffe0b2; border: 2px solid #ff9800; }
        .estado-denegado { background-color: #b71c1c; color: #ffcdd2; border: 2px solid #f44336; }
        .estado-inactivo { background-color: #1a1a1a; color: #bbb; border: 2px solid #333; }

        #b-detalle {
            display: none;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
            text-align: left;
            color: #fff;
        }
        #b-foto, #b-foto-vacia {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 3px solid #fff;
        }
        #b-foto { object-fit: cover; display: none; background: #333; }
        #b-foto-vacia {
            display: none;
            align-items: center;
            justify-content: center;
            background: #333;
            font-size: 2rem;
        }
        .b-texto { overflow: hidden; }
        #b-nombre { display: block; font-size: 1.3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #b-uid { display: block; font-size: 0.9rem; color: #ddd; margin-top: 4px; font-family: monospace; }
        #b-hora { display: block; font-size: 0.75rem; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="header-terminal">
        <div id="reloj">00:00:00</div>
        <div id="fecha">Cargando...</div>
    </div>

    <div class="terminal-screen">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="face-frame"></div>
        <button class="btn-accion" style="left: 15px;" onclick="activarCamaraManual()">📷 Activar Cámara</button>
        <button class="btn-accion" style="right: 15px;" onclick="capturarYVerificarRostro()">🔘 Escanear</button>
    </div>

    <div id="banner-estado" class="estado-inactivo">
        <div id="b-titulo">TERMINAL ACTIVA - ESPERANDO TARJETA O ROSTRO</div>
        <div id="b-detalle">
            <img id="b-foto" alt="Rostro">
            <div id="b-foto-vacia">👤</div>
            <div class="b-texto">
                <b id="b-nombre">-</b>
                <span id="b-uid">-</span>
                <span id="b-hora"></span>
            </div>
        </div>
    </div>

    <script>
        const MOTIVOS = {
            ROSTRO_NO_RECONOCIDO: "ROSTRO NO RECONOCIDO",
            ROSTRO_NO_DETECTADO: "NO SE DETECTÓ ROSTRO",
            NO_REGISTRADO: "TARJETA NO REGISTRADA",
            MALA_LECTURA: "ERROR DE LECTURA DE TARJETA"
        };
        const MOSTRAR_EVENTO_SEGUNDOS = 6;
        let avisoCamara = null;
        let fotoActual = null;

        function pintarBanner(clase, titulo, datos) {
            const banner = document.getElementById('banner-estado');
            banner.className = clase;
            document.getElementById('b-titulo').innerText = titulo;

            const detalle = document.getElementById('b-detalle');
            if (!datos) {
                detalle.style.display = 'none';
                return;
            }
            detalle.style.display = 'flex';
            document.getElementById('b-nombre').innerText = datos.usuario || 'Desconocido';
            document.getElementById('b-uid').innerText = datos.uid ? `Tarjeta: ${datos.uid}` : 'Sin tarjeta asociada';
            document.getElementById('b-hora').innerText = datos.fecha_hora || '';

            // Cambiar la foto solo si corresponde a otra persona (evita parpadeo en cada consulta)
            const foto = document.getElementById('b-foto');
            const fotoVacia = document.getElementById('b-foto-vacia');
            if (datos.foto_url && datos.foto_url !== fotoActual) {
                fotoActual = datos.foto_url;
                foto.src = datos.foto_url;
            }
            foto.style.display = datos.foto_url ? 'block' : 'none';
            fotoVacia.style.display = datos.foto_url ? 'none' : 'flex';
        }

        function renderizarEstado(data) {
            const u = data.ultimo;
            const reciente = u && u.hace_segundos < MOSTRAR_EVENTO_SEGUNDOS;

            if (reciente && u.estado === 'PERMITIDO') {
                const titulo = data.chapa_abierta
                    ? `🔓 ACCESO AUTORIZADO · PUERTA ABIERTA (${data.tiempo_restante}s)`
                    : '🔓 ACCESO AUTORIZADO';
                pintarBanner('estado-ok', titulo, u);
            } else if (reciente) {
                const motivo = MOTIVOS[u.detalle] || 'DENEGADO';
                pintarBanner('estado-denegado', `❌ ACCESO DENEGADO · ${motivo}`, u);
            } else if (avisoCamara) {
                pintarBanner('estado-espera', avisoCamara, null);
            } else {
                pintarBanner('estado-inactivo', 'TERMINAL ACTIVA - ESPERANDO TARJETA O ROSTRO', null);
            }
        }

        async function activarCamaraManual() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                avisoCamara = '⚠️ Cámara bloqueada: abre esta página con https://';
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, audio: false
                });
                document.getElementById('webcam').srcObject = stream;
                avisoCamara = null;
            } catch (err) {
                avisoCamara = `⚠️ No se pudo abrir la cámara (${err.name})`;
            }
        }

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString('es-CL');
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-CL', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        async function capturarYVerificarRostro() {
            const video = document.getElementById('webcam');
            if (!video.videoWidth) {
                avisoCamara = '⚠️ Primero activa la cámara';
                return;
            }
            avisoCamara = null;
            pintarBanner('estado-espera', '🔍 Verificando rostro...', null);

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const res = await fetch('/api/verificar_rostro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imagen: canvas.toDataURL('image/jpeg') })
                });
                const r = await res.json();
                if (!r.success && !r.mensaje.startsWith('❌')) {
                    avisoCamara = `⚠️ ${r.mensaje}`;
                }
            } catch (err) {
                avisoCamara = '⚠️ Sin conexión con el servidor';
            }
            actualizarEstado();
        }

        function actualizarEstado() {
            fetch('/api/estado', { cache: 'no-store' })
                .then(res => res.json())
                .then(renderizarEstado)
                .catch(err => console.error(err));
        }

        activarCamaraManual();
        setInterval(actualizarReloj, 1000);
        setInterval(actualizarEstado, 500);
        actualizarReloj();
        actualizarEstado();
    </script>
</body>
</html>
