<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo y Configuración NFC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex align-items-center justify-content-between">
            <h2>🚪 Monitor de Accesos NFC (Traductor Visual)</h2>
            <a href="/celular" target="_blank" class="btn btn-outline-info btn-sm">📱 Abrir Vista Celular</a>
        </header>

        <div class="row g-4">
            <!-- PANEL DE CONFIGURACIÓN -->
            <div class="col-md-5">
                <div class="card bg-secondary text-light shadow-sm mb-4">
                    <div class="card-header bg-primary fw-bold">🎴 Configuración: Agregar / Editar Usuario</div>
                    <div class="card-body">
                        <input type="text" id="input-uid" class="form-control mb-2" placeholder="Código UID (Ej: 0484CAB9)">
                        <input type="text" id="input-nombre" class="form-control mb-3" placeholder="Nombre del Usuario">
                        <button class="btn btn-success w-100 fw-bold" onclick="guardarUsuario()">💾 Guardar Usuario</button>
                    </div>
                </div>

                <div class="card bg-secondary text-light shadow-sm mb-4">
                    <div class="card-header bg-danger fw-bold">⚡ Configuración: Pruebas de Hardware (Manda al Arduino)</div>
                    <div class="card-body d-grid gap-2">
                        <button class="btn btn-outline-light" onclick="enviarDebug('DBG_START')">🔄 Modo Parpadeo Lento</button>
                        <button class="btn btn-outline-warning" onclick="enviarDebug('DBG_CHAPA_ON')">🔌 Activar Chapa Continua</button>
                        <button class="btn btn-outline-info" onclick="enviarDebug('DBG_CHAPA_OFF')">⛔ Desactivar Chapa (0V)</button>
                        <button class="btn btn-outline-success" onclick="enviarDebug('OK')">🔓 Simular Pulso de Apertura 6s</button>
                    </div>
                </div>
            </div>

            <!-- PANEL DE MONITOREO -->
            <div class="col-md-7">
                <div class="card bg-secondary text-light shadow-sm mb-4">
                    <div class="card-header bg-dark fw-bold">📡 Actividad en Tiempo Real</div>
                    <div class="card-body p-0" style="max-height: 250px; overflow-y: auto;">
                        <table class="table table-dark table-striped mb-0 font-monospace" style="font-size: 0.9rem;">
                            <thead><tr><th>Hora</th><th>Estado</th><th>Usuario</th><th>UID</th></tr></thead>
                            <tbody id="tabla-logs"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card bg-secondary text-light shadow-sm">
                    <div class="card-header bg-dark fw-bold">🎴 Usuarios Registrados</div>
                    <div class="card-body p-0" style="max-height: 250px; overflow-y: auto;">
                        <table class="table table-dark table-sm mb-0">
                            <thead><tr><th>Nombre</th><th>UID</th><th>Acción</th></tr></thead>
                            <tbody id="tabla-usuarios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function refrescar() {
            fetch('/api/estado').then(res => res.json()).then(data => {
                let tbody = document.getElementById('tabla-logs');
                tbody.innerHTML = '';
                data.logs.forEach(l => {
                    let color = l.estado === 'PERMITIDO' ? 'text-success fw-bold' : 'text-danger fw-bold';
                    tbody.innerHTML += `<tr><td>${l.fecha_hora.split(' ')[1]}</td><td class="${color}">${l.estado}</td><td>${l.usuario}</td><td><code>${l.uid}</code></td></tr>`;
                });
                
                let tusers = document.getElementById('tabla-usuarios');
                tusers.innerHTML = '';
                for (const [uid, nombre] of Object.entries(data.usuarios)) {
                    tusers.innerHTML += `<tr><td>${nombre}</td><td><code>${uid}</code></td>
                    <td><button class="btn btn-danger btn-sm py-0 px-2" onclick="eliminarUsuario('${uid}')">X</button></td></tr>`;
                }
            });
        }

        function guardarUsuario() {
            let uid = document.getElementById('input-uid').value;
            let nombre = document.getElementById('input-nombre').value;
            fetch('/api/usuario/guardar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uid, nombre}) })
            .then(res => res.json()).then(r => { if(r.success){ document.getElementById('input-uid').value=''; document.getElementById('input-nombre').value=''; refrescar(); }});
        }

        function eliminarUsuario(uid) {
            if(confirm('¿Seguro que deseas eliminar este usuario?')) {
                fetch('/api/usuario/eliminar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uid}) }).then(() => refrescar());
            }
        }

        function enviarDebug(cmd) {
            // Esto escribe la orden en el archivo para que el motor la ejecute al instante
            fetch('/api/debug', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({cmd}) });
        }

        setInterval(refrescar, 1500);
        refrescar();
    </script>
</body>
</html>
