<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Biométrica - Chapa NFC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .header-terminal {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 8px 15px;
            border-radius: 8px;
            border-bottom: 2px solid #00ff88;
        }
        #reloj { font-size: 1.3rem; font-weight: bold; color: #00ff88; }
        #fecha { font-size: 0.8rem; color: #888; text-transform: uppercase; }

        .terminal-screen {
            position: relative;
            width: 100%;
            max-width: 380px;
            flex-grow: 1;
            max-height: 40vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-frame {
            position: absolute;
            width: 130px;
            height: 170px;
            border: 2px dashed rgba(0, 255, 136, 0.7);
            border-radius: 50% / 40%;
            pointer-events: none;
        }
        .btn-accion {
            position: absolute;
            bottom: 8px;
            background: rgba(0, 255, 136, 0.9);
            color: #000;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10;
        }
        #escaneo {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            font-size: 0.75rem;
            color: #00ff88;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 8px;
            border-radius: 10px;
            z-index: 10;
            text-align: center;
        }

        /* BANNER PEQUEÑO EN ESPERA */
        #banner-estado {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #bbb;
        }

        /* PANTALLA COMPLETA DEL ACCESO */
        #pantalla-acceso {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 12px;
        }
        #pantalla-acceso.visible { display: flex; }
        .acceso-ok { background: #1b5e20; color: #e8f5e9; }
        .acceso-denegado { background: #b71c1c; color: #ffebee; }
        #p-titulo { font-size: 2rem; font-weight: bold; }
        #p-motivo { font-size: 1.2rem; font-weight: bold; min-height: 1.4em; }
        #p-foto, #p-foto-vacia {
            width: min(60vmin, 320px);
            height: min(60vmin, 320px);
            border-radius: 50%;
            border: 6px solid #fff;
            flex-shrink: 0;
        }
        #p-foto { object-fit: cover; display: none; background: #333; }
        #p-foto-vacia {
            display: none;
            align-items: center;
            justify-content: center;
            background: #333;
            font-size: 6rem;
        }
        #p-nombre { font-size: 2.6rem; font-weight: bold; overflow-wrap: anywhere; }
        #p-uid { font-size: 1.4rem; font-family: monospace; }
        #p-hora { font-size: 1rem; opacity: 0.85; }
        #p-puerta { font-size: 1.6rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="header-terminal">
        <div id="reloj">00:00:00</div>
        <div id="fecha">Cargando...</div>
        <div id="conexion" style="font-size: 0.75rem; color: #888;">● CONECTANDO</div>
    </div>

    <div class="terminal-screen">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="face-frame"></div>
        <div id="escaneo">● Iniciando cámara...</div>
        <button class="btn-accion" onclick="activarCamaraManual()">📷 Activar Cámara</button>
    </div>

    <div id="guia-captura" style="display:none; padding:10px; text-align:center; font-weight:bold; background:rgba(0,0,0,0.6); color:#0f0;"></div>
    <div id="banner-estado">TERMINAL ACTIVA - ESPERANDO TARJETA O ROSTRO</div>

    <!-- PANTALLA COMPLETA DEL RESULTADO -->
    <div id="pantalla-acceso">
        <div id="p-titulo"></div>
        <div id="p-motivo"></div>
        <img id="p-foto" alt="Rostro">
        <div id="p-foto-vacia">👤</div>
        <div id="p-nombre"></div>
        <div id="p-uid"></div>
        <div id="p-puerta"></div>
        <div id="p-hora"></div>
    </div>

    <script>
        const MOTIVOS = {
            ROSTRO_NO_RECONOCIDO: "ROSTRO NO RECONOCIDO",
            ROSTRO_NO_DETECTADO: "NO SE DETECTÓ ROSTRO",
            NO_REGISTRADO: "TARJETA NO REGISTRADA",
            MALA_LECTURA: "ERROR DE LECTURA DE TARJETA"
        };
        const MOSTRAR_EVENTO_SEGUNDOS = 6;
        const INTERVALO_ESCANEO_MS = 1200;
        const ANCHO_ESCANEO = 320;   // se envía una imagen chica: basta para reconocer la cara
        let avisoCamara = null;
        let pausaHasta = 0;          // después de un resultado, se espera antes del siguiente escaneo
        let mostrandoAcceso = false; // mientras el resultado ocupa la pantalla, no se escanea
        let fotoActual = null;
        let ultimoEventoMostrado = null;

        // ----- Texto de estado del escaneo (para saber en qué paso se corta) -----
        function estadoEscaneo(texto) {
            document.getElementById('escaneo').innerText = texto;
        }

        // ----- Resultado a pantalla completa -----
        function mostrarAcceso(clase, titulo, motivo, datos, puerta) {
            const pantalla = document.getElementById('pantalla-acceso');
            pantalla.className = clase + ' visible';
            document.getElementById('p-titulo').innerText = titulo;
            document.getElementById('p-motivo').innerText = motivo || '';
            document.getElementById('p-nombre').innerText = datos.usuario || 'Desconocido';
            document.getElementById('p-uid').innerText = datos.uid ? `Tarjeta: ${datos.uid}` : 'Sin tarjeta asociada';
            document.getElementById('p-hora').innerText = datos.fecha_hora || '';
            document.getElementById('p-puerta').innerText = puerta || '';

            const foto = document.getElementById('p-foto');
            const fotoVacia = document.getElementById('p-foto-vacia');
            if (datos.foto_url && datos.foto_url !== fotoActual) {
                fotoActual = datos.foto_url;
                foto.src = datos.foto_url;
            }
            foto.style.display = datos.foto_url ? 'block' : 'none';
            fotoVacia.style.display = datos.foto_url ? 'none' : 'flex';
        }

        function ocultarAcceso() {
            document.getElementById('pantalla-acceso').className = '';
        }

        function renderizarEstado(data) {
            gestionarCapturaCelular(data.captura || null);
            const u = data.ultimo;
            const reciente = u && u.hace_segundos < MOSTRAR_EVENTO_SEGUNDOS;
            mostrandoAcceso = Boolean(reciente);

            if (reciente && u.estado === 'PERMITIDO') {
                const puerta = data.chapa_abierta ? `PUERTA ABIERTA · ${data.tiempo_restante}s` : '';
                mostrarAcceso('acceso-ok', '🔓 ¡BIENVENIDO!', '', u, puerta);
                pausaHasta = Math.max(pausaHasta, Date.now() + 1000);
            } else if (reciente) {
                const motivo = MOTIVOS[u.detalle] || 'DENEGADO';
                mostrarAcceso('acceso-denegado', '❌ ACCESO DENEGADO', motivo, u, '');
            } else {
                ocultarAcceso();
                const banner = document.getElementById('banner-estado');
                banner.innerText = avisoCamara || 'TERMINAL ACTIVA - ESPERANDO TARJETA O ROSTRO';
            }
        }

        // ----- Cámara -----
        async function activarCamaraManual() {
            // En el celular, el navegador bloquea la cámara si la página no es HTTPS
            if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                avisoCamara = '⚠️ Cámara bloqueada: abre la página con https:// y acepta el certificado';
                estadoEscaneo('⚠️ Cámara bloqueada (usa https)');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, audio: false
                });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                await video.play().catch(() => {});
                avisoCamara = null;
                estadoEscaneo('● Buscando rostro...');
            } catch (err) {
                avisoCamara = `⚠️ No se pudo abrir la cámara (${err.name})`;
                estadoEscaneo(`⚠️ Cámara: ${err.name}. Toca "Activar Cámara"`);
            }
        }

        // ----- Escaneo facial automático (sin botones) -----
        async function escanearRostroAuto() {
            const video = document.getElementById('webcam');
            if (capturaActual) {
                estadoEscaneo('● Registro de rostro en curso');
            } else if (mostrandoAcceso) {
                // El resultado está en pantalla: no se escanea ni se vuelve a abrir la chapa
            } else if (Date.now() < pausaHasta) {
                // esperando después del último resultado
            } else if (!video.videoWidth) {
                estadoEscaneo('⚠️ La cámara no entrega imagen');
            } else {
                const escala = ANCHO_ESCANEO / video.videoWidth;
                const canvas = document.createElement('canvas');
                canvas.width = ANCHO_ESCANEO;
                canvas.height = Math.round(video.videoHeight * escala);
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                estadoEscaneo('● Analizando rostro...');
                try {
                    const r = await fetch('/api/verificar_rostro', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imagen: canvas.toDataURL('image/jpeg', 0.8), auto: true })
                    }).then(res => res.json());

                    if (r.success) {
                        estadoEscaneo('✅ ' + r.mensaje);
                        pausaHasta = Date.now() + 6000;
                    } else if (r.sin_rostro) {
                        estadoEscaneo('● Buscando rostro...');
                        pausaHasta = 0;
                    } else {
                        estadoEscaneo('❌ ' + (r.mensaje || 'Rostro no reconocido'));
                        pausaHasta = Date.now() + 2500;
                    }
                } catch (err) {
                    estadoEscaneo('⚠️ Sin conexión con el servidor. Reintentando...');
                    pausaHasta = Date.now() + 3000;
                }
            }
            setTimeout(escanearRostroAuto, INTERVALO_ESCANEO_MS);
        }

        // ----- Registro de rostro desde este celular -----
        let capturaActual = null;     // captura en curso que informa el servidor
        let capturaTimer = null;
        let enviandoCaptura = false;
        const CAPTURA_ANCHO = 480;    // imagen más grande para el registro (mejor calidad)

        function gestionarCapturaCelular(captura) {
            const guia = document.getElementById('guia-captura');
            capturaActual = captura;
            if (!captura) {
                guia.style.display = 'none';
                if (capturaTimer) { clearInterval(capturaTimer); capturaTimer = null; }
                return;
            }
            guia.style.display = 'block';
            if (captura.origen !== 'celular') {
                guia.innerText = `Registro de rostro de ${captura.nombre} desde la computadora...`;
                if (capturaTimer) { clearInterval(capturaTimer); capturaTimer = null; }
                return;
            }
            if (!capturaTimer) {
                guia.innerText = `Registrando rostro de ${captura.nombre}: ${captura.tomadas}/${captura.meta}`;
                capturaTimer = setInterval(enviarFrameCaptura, 500);
            }
        }

        async function enviarFrameCaptura() {
            const video = document.getElementById('webcam');
            const guia = document.getElementById('guia-captura');
            if (enviandoCaptura || !capturaActual || !video.videoWidth) return;
            const escala = CAPTURA_ANCHO / video.videoWidth;
            const canvas = document.createElement('canvas');
            canvas.width = CAPTURA_ANCHO;
            canvas.height = Math.round(video.videoHeight * escala);
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            enviandoCaptura = true;
            try {
                const r = await fetch('/api/captura/frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imagen: canvas.toDataURL('image/jpeg', 0.92) })
                }).then(res => res.json());
                guia.innerText = r.mensaje || '';
            } catch (err) {
                guia.innerText = 'Sin conexión con el servidor. Reintentando...';
            } finally {
                enviandoCaptura = false;
            }
        }

        // ----- Vista previa para el admin: una imagen chica por segundo -----
        let enviandoVista = false;
        async function enviarVistaCelular() {
            const video = document.getElementById('webcam');
            if (enviandoVista || !video.videoWidth) return;
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = Math.round(video.videoHeight * (320 / video.videoWidth));
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            enviandoVista = true;
            try {
                await fetch('/api/celular/vista', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imagen: canvas.toDataURL('image/jpeg', 0.6) })
                });
            } catch (err) {
                // sin conexión: se reintenta en el siguiente segundo
            } finally {
                enviandoVista = false;
            }
        }
        setInterval(enviarVistaCelular, 1000);

        // ----- Reloj -----
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString('es-CL');
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-CL', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        // ----- Estado en tiempo real -----
        function actualizarEstado() {
            fetch('/api/estado', { cache: 'no-store' })
                .then(res => res.json())
                .then(renderizarEstado)
                .catch(err => console.error(err));
        }

        function marcarConexion(activa) {
            const el = document.getElementById('conexion');
            el.innerText = activa ? '● EN VIVO' : '● SIN CONEXIÓN';
            el.style.color = activa ? '#00ff88' : '#f44336';
        }

        function conectarTiempoReal() {
            const fuente = new EventSource('/api/stream');
            fuente.onopen = () => marcarConexion(true);
            fuente.onmessage = (ev) => {
                marcarConexion(true);
                renderizarEstado(JSON.parse(ev.data));
            };
            fuente.onerror = () => marcarConexion(false); // el navegador reintenta solo
        }

        // El escaneo corre siempre desde que carga la página: si no hay imagen, espera sola
        escanearRostroAuto();
        activarCamaraManual();
        setInterval(actualizarReloj, 1000);
        conectarTiempoReal();
        actualizarReloj();
        actualizarEstado();
    </script>
</body>
</html>
